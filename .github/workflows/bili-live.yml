name: 炫神直播开播提醒

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=真实检查直播状态；bark_test=只测试通知'
        required: true
        default: check
        type: choice
        options:
          - check
          - bark_test

permissions:
  contents: write

concurrency:
  group: bilibili-live-check
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4

      - name: 查询直播并发送 Bark 通知
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          CHECK_MODE: ${{ inputs.mode || 'check' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          SHORT_ROOM_ID = 84074
          LONG_ROOM_ID = 14709735
          LIVE_URL = f"https://live.bilibili.com/{SHORT_ROOM_ID}"
          STATE_FILE = Path('live_state.json')
          BARK_KEY = os.environ.get('BARK_KEY', '')

          def get_json(url, payload=None):
              data = json.dumps(payload, ensure_ascii=False).encode('utf-8') if payload is not None else None
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36',
                  'Accept': 'application/json',
              }
              if data is None:
                  headers['Referer'] = f'https://live.bilibili.com/{SHORT_ROOM_ID}'
              else:
                  headers['Content-Type'] = 'application/json; charset=utf-8'
              with urlopen(Request(url, data=data, headers=headers), timeout=20) as response:
                  return json.load(response)
          def notify(title, body):
              if not BARK_KEY:
                  raise RuntimeError('没有找到 BARK_KEY，请检查 GitHub Secrets')
              result = get_json('https://api.day.app/push', {
                  'device_key': BARK_KEY,
                  'title': title,
                  'body': body,
                  'group': 'B站开播提醒',
                  'url': LIVE_URL,
              })
              if result.get('code') != 200:
                  raise RuntimeError(f'Bark 推送失败：{result}')
              print('✅ Bark 推送成功')

          if os.environ.get('CHECK_MODE') == 'bark_test':
              notify('✅ Bark 测试通知', 'Bark 推送链路正常。这条消息不代表开播。')
          else:
              # 两种房间号 + 两种 B 站接口；优先用含 live_time 的 room_init。
              urls = [
                  f'https://api.live.bilibili.com/room/v1/Room/room_init?id={SHORT_ROOM_ID}',
                  f'https://api.live.bilibili.com/room/v1/Room/room_init?id={LONG_ROOM_ID}',
                  f'https://api.live.bilibili.com/room/v1/Room/get_info?room_id={SHORT_ROOM_ID}',
              ]
              info = None
              errors = []
              for url in urls:
                  try:
                      response = get_json(url)
                      if response.get('code') != 0 or not isinstance(response.get('data'), dict):
                          raise ValueError(f"code={response.get('code')}, message={response.get('message')}")
                      candidate = response['data']
                      if candidate.get('live_status') not in (0, 1, 2):
                          raise ValueError('接口没有返回有效的 live_status')
                      # 防止接口返回其他直播间的信息。
                      ids = {candidate.get('room_id'), candidate.get('short_id')}
                      if not ids.intersection({SHORT_ROOM_ID, LONG_ROOM_ID}):
                          raise ValueError(f'返回了意外的直播间：{ids}')
                      info = candidate
                      print('✅ B站接口访问成功')
                      print(f"房间号: {candidate.get('room_id')}; 短号: {candidate.get('short_id')}")
                      break
                  except Exception as exc:
                      errors.append(f'{type(exc).__name__}: {exc}')
                      print(f'⚠️ 一个B站查询接口失败: {type(exc).__name__}: {exc}')
              if info is None:
                  raise RuntimeError('全部B站接口查询失败：' + '; '.join(errors))

              live = (info['live_status'] == 1)
              raw_time = info.get('live_time')
              # 直播开始时间用作本次直播 ID，防止漏掉短暂下播后再次开播。
              live_time = str(raw_time) if live and raw_time not in (None, '', 0, '0', -62170012800) else None
              previous = json.loads(STATE_FILE.read_text(encoding='utf-8')) if STATE_FILE.exists() else {}
              old_live = previous.get('status') == 1
              old_time = previous.get('live_time')
              print(f"直播状态: {'直播中' if live else '未开播/轮播'}; 本次开播时间: {live_time or '未知'}")
              print(f"上次记录: status={previous.get('status', '无')}, live_time={old_time or '无'}")

              is_new_session = live and (
                  not old_live or (live_time is not None and old_time != live_time)
              )
              if is_new_session:
                  notify('🔴 炫神开播啦！', '检测到炫神正在直播，点击进入直播间！')
              elif live:
                  print('ℹ️ 已经提醒过同一场直播，不重复发送')
              else:
                  print('ℹ️ 当前未开播，不发送提醒')

              new_state = {'status': 1 if live else 0, 'live_time': live_time if live else None}
              if new_state != previous:
                  STATE_FILE.write_text(json.dumps(new_state, ensure_ascii=False) + '\n', encoding='utf-8')
                  print('✅ 已更新直播状态文件')
          PY

      - name: 保存直播状态
        if: ${{ inputs.mode != 'bark_test' }}
        run: |
          if [ -n "$(git status --porcelain -- live_state.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add live_state.json
            git commit -m 'Update live state [skip ci]'
            git push
          fi
